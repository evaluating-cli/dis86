[package]
name = "dis86"
version = "0.1.0"
edition = "2021"

[features]
default = []
# emu86 (the interpreter, its DOS layer, and the SST harness) is frozen offline
# tooling: it is not built or tested by the default lane. Enable it explicitly
# (`--features emu86`) when running the hardware-corpus tools offline; see the
# development direction in README.md.
emu86 = []
# The interactive emu86 frontend is optional.  The decompiler and its unit
# tests do not need a host display or SDL development files.
sdl = ["dep:sdl2"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pico-args = "0.5.0"
itertools = "0.12.1"
static_assertions = "1.1.0"
libc = "0.2"
moo-rs = { path = "third_party/moo" }
sdl2 = { version = "0.38", features = ["use-pkgconfig", "unsafe_textures"], optional = true } ## Used for the interactive emu86 frontend only

[build-dependencies]
cc = "1.0.87"

[[bin]]
name = "emu86"
path = "src/bin/emu86.rs"
required-features = ["sdl", "emu86"]

[[bin]]
name = "emu86_sst"
path = "src/bin/emu86_sst.rs"
required-features = ["emu86"]
