[package]
name = "moo-rs"
description = "A library crate for reading and writing MOO (Machine Opcode Operation) files."
version = "0.3.0"
edition = "2021"
authors = ["Daniel Balsom"]
license = "MIT"
repository = "https://github.com/dbalsom/moo"

[lib]
name = "moo"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[dependencies]
binrw = "0.15"
sha1 = "0.11.0-pre.5"
env_logger = "0.11"
# Optional dependencies
serde = { version = "1.0", features = ["derive"], optional = true }
log = "0.4"
thiserror = "2.0"
flate2 = { version = "1.1", default-features = false, features = ["zlib"], optional = true }
document-features = "0.2.11"

[dev-dependencies]
tempfile = "3.23.0"

[features]
default = ["use_serde", "gzip"]
## Uses [serde](https://docs.rs/serde/latest/serde/) for serialization/deserialization support. This feature provides the `Deserialize` trait for several MOO types.
use_serde = ["serde"]
## Support reading and writing gzipped MOO archives.
gzip = ["flate2"]
