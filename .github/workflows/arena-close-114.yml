# Temporary: posts and closes issue #114 from a runner, because the Arena App
# token is 403 for issue comments and close from the sandbox.
# Delete after the single run.
name: arena-close-114

on:
  push:
    branches: [arena/3026b011-dis86]

permissions:
  contents: read
  issues: write

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Comment and close issue 114
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X POST repos/evaluating-cli/dis86/issues/114/comments \
            -F body=@.github/tmp-issue-114-body.md
          gh api -X PATCH repos/evaluating-cli/dis86/issues/114 -F state=closed
          echo "issue 114 commented and closed"
