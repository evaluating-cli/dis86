name: parity fixture

on:
  push:
    branches: [main]
    paths:
      - 'parity/**'
      - 'hydra/src/**'
      - 'confgen/**'
      - 'dis86/**'
      - '.github/workflows/parity-fixture.yml'
  pull_request:
    paths:
      - 'parity/**'
      - 'hydra/src/**'
      - 'confgen/**'
      - 'dis86/**'
      - '.github/workflows/parity-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Golden and native outbox parity
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set cache week
        id: cache-week
        run: |
          echo "week=$(date +%Y-%W)" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/.cache/apt-archives/partial"

      - name: Cache apt package archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: ${{ runner.os }}-dosemu-parity-v2-${{ steps.cache-week.outputs.week }}-${{ hashFiles('.github/workflows/parity-fixture.yml') }}
          restore-keys: |
            ${{ runner.os }}-dosemu-parity-v2-

      - name: Prepare cached apt archives for _apt
        run: |
          set -euo pipefail
          APT_CACHE="$HOME/.cache/apt-archives"
          # apt downloads as _apt, not the runner. Mirror the distro archive
          # tree (archives root:root, partial _apt:root 700) and hand the
          # cached .debs to _apt too; Trim chowns them back before the cache
          # is saved. _apt must traverse every path component, so keep this
          # under a world-traversable directory (not a 700 home).
          sudo mkdir -p "$APT_CACHE/partial"
          sudo chown -R _apt:root "$APT_CACHE"
          sudo chmod 700 "$APT_CACHE/partial"

      - name: Stop background apt activity
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer \
            2>/dev/null || true
          sudo systemctl stop unattended-upgrades.service \
            apt-daily.service apt-daily-upgrade.service 2>/dev/null || true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dis86

      - name: Install fixture toolchain
        run: |
          set -euo pipefail
          APT_CACHE="$HOME/.cache/apt-archives"
          APT_OPTS=(
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o Dir::Cache::archives="$APT_CACHE"
          )
          sudo apt-get "${APT_OPTS[@]}" update -q
          sudo apt-get "${APT_OPTS[@]}" install -y --no-install-recommends nasm

      - name: Gate 1 + native lane (dosemu2-free)
        run: bash parity/build.sh

      - name: Install stock dosemu2 runtime
        id: runtime
        run: |
          set -euo pipefail
          . /etc/os-release
          APT_CACHE="$HOME/.cache/apt-archives"
          APT_OPTS=(
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o Dir::Cache::archives="$APT_CACHE"
          )

          # Launchpad's PPA archive can be down for hours, taking every index
          # and pool path with it (2026-10-21: ppa.launchpadcontent.net
          # answered 503 to all of them, and the legacy ppa.launchpad.net
          # name fails TLS verification from runners - curl exit 60). No
          # dosemu2 package can be fetched while that lasts, so the golden
          # lane cannot run. Do not fail this lane on an upstream outage:
          # record the gap loudly and let the dosemu2-free gates stand,
          # rather than reporting a fixture failure that is not one.
          if ! curl -fsS --max-time 20 -o /dev/null \
              "https://ppa.launchpadcontent.net/dosemu2/ppa/ubuntu/dists/${VERSION_CODENAME}/InRelease"; then
            echo "::warning title=golden lane skipped::Launchpad's PPA archive is unreachable; run_golden.sh did not run, so golden/native parity is NOT verified by this run."
            {
              echo "### Golden lane SKIPPED - Launchpad archive unreachable"
              echo ""
              echo 'The dosemu2 PPA index could not be fetched, so `parity/run_golden.sh` did not run.'
              echo "Gate 2 (native) still rebuilt the decompiled code and checked it against the"
              echo "expected lane table, but the golden comparison is unverified by this run."
              echo ""
              echo "Re-run this workflow once Launchpad is serving its archive again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "golden=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! command -v add-apt-repository >/dev/null 2>&1; then
            sudo apt-get "${APT_OPTS[@]}" install -y \
              --no-install-recommends software-properties-common
          fi

          added=0
          for attempt in 1 2 3; do
            if timeout 60 sudo add-apt-repository -n -y ppa:dosemu2/ppa; then
              added=1
              break
            fi
            echo "dosemu2 PPA setup attempt $attempt failed" >&2
            sleep $((attempt * 5))
          done
          if [ "$added" -ne 1 ]; then
            echo "dosemu2 PPA setup failed after retries" >&2
            exit 1
          fi

          sudo DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTS[@]}" update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTS[@]}" install -y \
            --no-install-recommends dosemu2 fdpp

          echo "### Runtime package identity" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          apt-cache policy dosemu2 fdpp | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          command -v dosemu
          dosemu --version || true

      - name: Trim cached apt archives
        if: always()
        run: |
          set -euo pipefail
          APT_CACHE="$HOME/.cache/apt-archives"
          sudo rm -rf "$APT_CACHE/partial"
          sudo rm -f "$APT_CACHE/lock"
          sudo mkdir -p "$APT_CACHE/partial"
          # actions/cache saves as the runner user; hand the archive tree back
          # after apt's _apt downloads.
          sudo chown -R "$(id -u):$(id -g)" "$APT_CACHE"

      - name: Golden lane + byte comparison
        if: steps.runtime.outputs.golden != 'skip'
        run: bash parity/run_golden.sh

      - name: Export parity evidence
        if: always()
        run: |
          set -euo pipefail
          echo "### Parity fixture (#96)" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/parity/native.lanes ] && [ -f build/parity/golden.lanes ]; then
            cmp build/parity/native.lanes build/parity/golden.lanes &&
              echo "native == golden (80-byte outbox snapshot)" ||
              echo "native != golden"
            od -An -tx1 -v build/parity/golden.lanes
          else
            echo "lane snapshots missing"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Show dosemu log on failure
        if: failure()
        run: |
          tail -200 build/parity/golden-dosemu.log 2>/dev/null || true
