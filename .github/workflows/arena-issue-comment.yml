name: arena issue comment

# TEMPORARY, single-use. Posts the issue #140 review (issue140-comment.md at the
# repo root) as a comment on the issue, because the sandbox token that produced
# it can write pull-request reviews but not non-PR issue comments:
#
#   POST /repos/.../issues/140/comments -> 403 "Resource not accessible by integration"
#   POST /repos/.../pulls/139/reviews   -> 200
#
# i.e. the OAuth App installation has pull_requests: write, issues: read. The
# runner's GITHUB_TOKEN, scoped to issues: write below, can post it. This PR is
# meant to be CLOSED, NOT MERGED - neither this file nor the markdown is
# intended for main.
on:
  pull_request:
    paths:
      - '.github/workflows/arena-issue-comment.yml'
      - 'issue140-comment.md'

permissions:
  contents: read
  issues: write

jobs:
  post:
    name: Post issue 140 review comment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ISSUE_NUMBER: 140
      BODY_FILE: issue140-comment.md
      # Substring used to detect an earlier successful post (a re-run or a
      # second push must not create a duplicate comment on the issue).
      MARKER: 'Verification + design review against current'
    steps:
      - uses: actions/checkout@v4

      - name: Create the comment (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments"

          if [ -z "$(gh api "$api" --jq ".[] | select(.body | contains(\"$MARKER\")) | .html_url" | head -1)" ]; then
            url=$(gh api --method POST "$api" -F "body=@$BODY_FILE" --jq .html_url)
            echo "posted: $url"
          else
            echo "a comment containing the marker already exists; skipping"
          fi
