name: arena-post-comments3

# TEMPORARY: posts the round-6 comments on the two new issues (#85, #86) using
# a GITHUB_TOKEN with `issues: write`. Idempotent: a per-issue marker guard
# skips issues that already carry a round-6 comment.
# Delete this workflow and .arena-post6/ when done.
on:
  push:
    paths:
      - '.arena-post6/**'
      - '.github/workflows/arena-post-comments3.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  post:
    name: Post round-6 comments
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Post comments (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for n in 101 102 103; do
            body=".arena-post6/issue-$n.md"
            if [ ! -f "$body" ]; then
              echo "issue #$n: no body file, skipping"
              continue
            fi
            count=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments?per_page=100" \
              --jq '[.[] | select(.body | contains("arena-triage-verify-r6"))] | length')
            if [ "$count" != "0" ]; then
              echo "issue #$n: already posted ($count existing), skipping"
              continue
            fi
            gh issue comment "$n" --body-file "$body"
            echo "issue #$n: posted"
          done
      - name: Confirm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for n in 101 102 103; do
            gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments?per_page=100" \
              --jq "\"issue #$n round-6 comments: \" + ([.[] | select(.body | contains(\"arena-triage-verify-r6\"))] | length | tostring)"
          done
