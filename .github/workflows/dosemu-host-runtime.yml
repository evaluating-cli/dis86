name: dosemu host runtime

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'hydra/src/dosemu_host/**'
      - 'hydra/src/meson.build'
      - 'hydra/src/native_host/**'
      - 'hydra/src/*.c'
      - 'hydra/src/*.h'
      - 'hydra/meson.build'
      - 'confgen/**'
      - '.github/workflows/dosemu-host-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Stock dosemu2 host integration (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # .com is split across two runners so each pays one boot. The old
      # same-job consecutive-run check is still available locally with
      # TEST_COM_CASE=both (the script default).
      matrix:
        include:
          - label: mz-ovl
            flavor: mz-ovl
          - label: exe
            flavor: exe
          - label: com 1/2
            flavor: com
            com_case: 1
          - label: com 2/2
            flavor: com
            com_case: 2
          - label: cap
            flavor: cap
          - label: ovl
            flavor: ovl

    steps:
      - uses: actions/checkout@v4

      - name: Set cache week
        id: cache-week
        run: |
          echo "week=$(date +%Y-%W)" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/.cache/apt-archives/partial"

      - name: Cache apt package archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          # All matrix legs deliberately share this key, which is safe only
          # while every leg installs the identical package set below. Do not
          # make that install flavour-dependent: a losing leg would then
          # restore a cache without its packages and could not re-save it.
          key: ${{ runner.os }}-dosemu-runtime-v2-${{ steps.cache-week.outputs.week }}-${{ hashFiles('.github/workflows/dosemu-host-runtime.yml') }}
          restore-keys: |
            ${{ runner.os }}-dosemu-runtime-v2-

      - name: Prepare cached apt archives for _apt
        run: |
          set -euo pipefail
          APT_CACHE="$HOME/.cache/apt-archives"
          # apt downloads as _apt, not the runner. Mirror the distro archive
          # tree (archives root:root, partial _apt:root 700) and hand the
          # cached .debs to _apt too; Trim chowns them back before the cache
          # is saved. _apt must traverse every path component, so keep this
          # under a world-traversable directory (not a 700 home).
          sudo mkdir -p "$APT_CACHE/partial"
          sudo chown -R _apt:root "$APT_CACHE"
          sudo chmod 700 "$APT_CACHE/partial"

      - name: Stop background apt activity
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer \
            2>/dev/null || true
          sudo systemctl stop unattended-upgrades.service \
            apt-daily.service apt-daily-upgrade.service 2>/dev/null || true

      - name: Install stock dosemu2 runtime
        run: |
          set -euo pipefail
          APT_CACHE="$HOME/.cache/apt-archives"
          APT_OPTS=(
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o Dir::Cache::archives="$APT_CACHE"
          )

          # The runner image normally ships add-apt-repository, but keep the
          # fallback for older images. Do not update twice when it is present.
          if ! command -v add-apt-repository >/dev/null 2>&1; then
            sudo apt-get "${APT_OPTS[@]}" update -q
            sudo apt-get "${APT_OPTS[@]}" install -y \
              --no-install-recommends software-properties-common
          fi

          # Launchpad occasionally returns a transient signing-key 500 while
          # resolving the PPA. Retry the repository setup so an infrastructure
          # blip does not masquerade as a Hydra runtime failure. -n keeps the
          # update explicit so it runs under APT_OPTS and the archived .debs
          # are reused.
          added=0
          for attempt in 1 2 3; do
            if timeout 60 sudo add-apt-repository -n -y ppa:dosemu2/ppa; then
              added=1
              break
            fi
            echo "dosemu2 PPA setup attempt $attempt failed" >&2
            sleep $((attempt * 5))
          done
          if [ "$added" -ne 1 ]; then
            echo "dosemu2 PPA setup failed after retries" >&2
            exit 1
          fi

          sudo DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTS[@]}" update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTS[@]}" install -y \
            --no-install-recommends dosemu2 fdpp nasm meson ninja-build

          echo "### Runtime package identity" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          apt-cache policy dosemu2 fdpp | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          command -v dosemu
          dosemu --version || true

      - name: Trim cached apt archives
        if: always()
        run: |
          set -euo pipefail
          APT_CACHE="$HOME/.cache/apt-archives"
          sudo rm -rf "$APT_CACHE/partial"
          sudo rm -f "$APT_CACHE/lock"
          sudo mkdir -p "$APT_CACHE/partial"
          # actions/cache saves as the runner user; hand the archive tree back
          # after apt's _apt downloads.
          sudo chown -R "$(id -u):$(id -g)" "$APT_CACHE"

      - name: Build Hydra host tests
        run: |
          set -euo pipefail
          meson setup hydra/build hydra
          ninja -C hydra/build

      - name: Verify overlay policy and capacity fail closed
        run: |
          set -euo pipefail
          hydra/build/src/dosemu_host/test_overlay_reject
          hydra/build/src/dosemu_host/test_overlay_budget
          hydra/build/src/dosemu_host/test_unimpl_trap
          echo "test_overlay_reject: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "test_overlay_budget: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "test_unimpl_trap: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the trace sink (dosemu2-free)
        run: |
          set -euo pipefail
          hydra/build/src/dosemu_host/test_trace
          echo "test_trace: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify native host skeleton (dosemu2-free)
        run: |
          set -euo pipefail
          hydra/build/src/native_host/test_native_host
          echo "test_native_host: PASS" >> "$GITHUB_STEP_SUMMARY"

      # mz-ovl is the only job that runs test_host + hydra_trace; if this leg
      # is renamed or dropped these gates disappear. Move them deliberately.
      - name: Run host state/transport test
        if: matrix.flavor == 'mz-ovl'
        run: |
          set -euo pipefail

          CONF=/tmp/opencode/dosemu_mshm.conf
          LOG=/tmp/opencode/host_test_dosemu.log
          COM="$GITHUB_WORKSPACE/hydra/build/src/dosemu_host/testprog.com"
          HOST_TEST="$GITHUB_WORKSPACE/hydra/build/src/dosemu_host/test_host"

          mkdir -p /tmp/opencode
          cat > "$CONF" <<'EOF'
          $_cpu_vm = "emulated"
          $_cpuemu = (1)
          $_sound = (off)
          $_layout = "us"
          $_vbios_post = (off)
          $_console = (0)
          $_video = "vga"
          $_hdimage = "+1"
          $_mapping = "mapmshm"
          EOF

          cp "$COM" /tmp/opencode/testprog.com
          export XDG_RUNTIME_DIR=/tmp/opencode/runtime
          mkdir -p "$XDG_RUNTIME_DIR/dosemu2"
          rm -f "$LOG"

          cleanup() {
            pkill -9 -x dosemu2.bin 2>/dev/null || true
            pkill -9 -x dosemu 2>/dev/null || true
          }
          trap cleanup EXIT
          cleanup
          sleep 1

          setsid bash -c \
            "tail -f /dev/null | timeout 180 /usr/bin/dosemu -p -f '$CONF' -dumb -H1 -E testprog.com -K /tmp/opencode </dev/null >'$LOG' 2>&1" \
            </dev/null >/dev/null 2>&1 &

          DOPID=""
          for _ in $(seq 1 80); do
            DOPID=$(pgrep -x dosemu2.bin | head -1 || true)
            [ -n "$DOPID" ] && break
            sleep 0.5
          done
          if [ -z "$DOPID" ]; then
            echo "dosemu2 did not start" >&2
            cat "$LOG" >&2 || true
            exit 2
          fi

          # Give -E testprog.com time to reach its guest wait loop so test_host's
          # breakpoint smoke operates in the writable COM segment.
          sleep 3
          "$HOST_TEST" "$DOPID"

          echo "tested commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "test_host: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the instrumented-execution trace tool
        if: matrix.flavor == 'mz-ovl'
        run: |
          set -euo pipefail

          CONF=/tmp/opencode/dosemu_mshm.conf
          LOG=/tmp/opencode/trace_tool_dosemu.log
          COM="$GITHUB_WORKSPACE/hydra/build/src/dosemu_host/testprog.com"
          TOOL="$GITHUB_WORKSPACE/hydra/build/src/dosemu_host/hydra_trace"
          USERLIB="$GITHUB_WORKSPACE/hydra/build/src/dosemu_host/libtest_trace_user.so"
          TRACE=/tmp/opencode/testprog.trace

          mkdir -p /tmp/opencode
          cat > "$CONF" <<'EOF'
          $_cpu_vm = "emulated"
          $_cpuemu = (1)
          $_sound = (off)
          $_layout = "us"
          $_vbios_post = (off)
          $_console = (0)
          $_video = "vga"
          $_hdimage = "+1"
          $_mapping = "mapmshm"
          EOF

          cp "$COM" /tmp/opencode/testprog.com
          export XDG_RUNTIME_DIR=/tmp/opencode/runtime
          mkdir -p "$XDG_RUNTIME_DIR/dosemu2"
          rm -f "$LOG" "$TRACE"

          cleanup() {
            pkill -9 -x dosemu2.bin 2>/dev/null || true
            pkill -9 -x dosemu 2>/dev/null || true
          }
          trap cleanup EXIT
          cleanup
          sleep 1

          setsid bash -c \
            "tail -f /dev/null | timeout 180 /usr/bin/dosemu -p -f '$CONF' -dumb -H1 -E testprog.com -K /tmp/opencode </dev/null >'$LOG' 2>&1" \
            </dev/null >/dev/null 2>&1 &

          DOPID=""
          for _ in $(seq 1 80); do
            DOPID=$(pgrep -x dosemu2.bin | head -1 || true)
            [ -n "$DOPID" ] && break
            sleep 0.5
          done
          if [ -z "$DOPID" ]; then
            echo "dosemu2 did not start" >&2
            cat "$LOG" >&2 || true
            exit 2
          fi

          # The guest waits for its go flag; --poke-image 2:1 releases it.
          "$TOOL" --pid "$DOPID" --program /tmp/opencode/testprog.com \
                  --trace "$TRACE" --lib "$USERLIB" \
                  --poke-image 2:1 --stop-after 4 --step --timeout-ms 5000

          # The trace must say what the fixture does: the hooked functions
          # are dispatched, and the call into the unhooked helper is
          # recorded with the instructions it ran.
          grep -q '^# hydra trace v1$' "$TRACE"
          grep -q '^dispatch enter cs=[0-9a-f]\{4\} ip=013e name=F_myfunc$' "$TRACE"
          grep -q '^dispatch enter cs=[0-9a-f]\{4\} ip=0146 name=F_callthru$' "$TRACE"
          grep -q '^native_call from=[0-9a-f]\{4\}:[0-9a-f]\{4\} to=[0-9a-f]\{4\}:014a nargs=0$' "$TRACE"
          grep -q '^step cs=[0-9a-f]\{4\} ip=014d$' "$TRACE"
          grep -q '^native_ret from=[0-9a-f]\{4\}:[0-9a-f]\{4\} to=[0-9a-f]\{4\}:014a dx=[0-9a-f]\{4\} ax=[0-9a-f]\{4\}$' "$TRACE"

          echo "hydra_trace: PASS" >> "$GITHUB_STEP_SUMMARY"
          cat "$TRACE" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Phase 7 acceptance matrix (${{ matrix.label }})
        env:
          TEST_COM_CASE: ${{ matrix.com_case }}
        run: |
          set -euo pipefail
          export DOSDEBUG_STREAM_LOG=/tmp/opencode/dosdebug_driver_stream.log
          rm -f "$DOSDEBUG_STREAM_LOG"
          TESTPROG_FLAVOR=${{ matrix.flavor }} timeout 600 \
            bash hydra/src/dosemu_host/run_driver_test.sh
          echo "Phase 7 flavour ${{ matrix.label }}: PASS" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Show dosemu log on failure
        if: failure()
        run: |
          if [ "${{ matrix.flavor }}" = "mz-ovl" ]; then
            echo "--- /tmp/opencode/host_test_dosemu.log ---"
            tail -200 /tmp/opencode/host_test_dosemu.log 2>/dev/null || true
            echo "--- /tmp/opencode/trace_tool_dosemu.log ---"
            tail -200 /tmp/opencode/trace_tool_dosemu.log 2>/dev/null || true
          fi
          echo "--- /tmp/opencode/driver_test.log ---"
          tail -200 /tmp/opencode/driver_test.log 2>/dev/null || true
          echo "--- /tmp/opencode/dosdebug_driver_stream.log ---"
          tail -600 /tmp/opencode/dosdebug_driver_stream.log 2>/dev/null || true
