name: arena-issue-verify

# TEMPORARY: arena research harness. Runs the published repros for issues
# #64/#65/#66/#67/#68/#69 against this branch's HEAD and commits the captured
# evidence back to the branch (CI logs are not reachable from the agent).
# Delete this workflow, .arena-verify/, and the OPT test additions afterwards.
on:
  push:
    paths-ignore:
      - '.arena-verify/out/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Run issue repros
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dis86
      - name: Build dis86
        run: cargo build --manifest-path dis86/Cargo.toml --locked
      - name: Generate repro binaries and configs
        run: |
          mkdir -p /tmp/verify /tmp/verify2
          OUT=/tmp/verify python3 .arena-verify/make_repros.py
          OUT=/tmp/verify2 python3 .arena-verify/make_repros2.py
      - name: Run repros (best effort, evidence captured)
        run: for s in .arena-verify/run*.sh; do bash "$s"; done
      - name: Commit evidence
        run: |
          git config user.name "arena-verify"
          git config user.email "arena-verify@users.noreply.github.com"
          git add -f .arena-verify/out
          git commit -m "TEMP: captured issue-verification evidence [skip ci]" || echo "nothing to commit"
          git push
