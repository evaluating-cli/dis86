name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-independent:
    name: Rust and shared-memory checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dis86
      - name: Test without legacy emulator dependencies
        run: just check

  issue-31-full-corpus:
    name: Issue 31 hardened SST full corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7ab2bd137cfe94a652ec0c69c947ec0483d9baa
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dis86
      - name: Record validation identity
        run: |
          set -euo pipefail
          {
            echo "run_date_utc=$(date -u +%Y-%m-%d)"
            echo "head_sha=$(git rev-parse HEAD)"
            echo "manifest_entries=$(awk '!/^#/ && NF >= 2 { n++ } END { print n+0 }' dis86/data/sst/manifest.txt)"
          } | tee issue-31-identity.log
      - name: Fetch pinned SST corpus
        run: ./scripts/sst_fetch.sh dis86/data/sst/full
      - name: Audit V1 scope
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path dis86/Cargo.toml --bin emu86_sst -- audit --probe \
            | tee issue-31-audit.log
      - name: Run hardened stride-1 corpus
        run: |
          set -euo pipefail
          cargo run --locked --release --manifest-path dis86/Cargo.toml --bin emu86_sst -- run \
            --stride 1 \
            --revocations dis86/data/sst/full/revocation_list.txt \
            $(awk '!/^#/ && NF >= 2 { print "dis86/data/sst/full/" $1 ".MOO" }' dis86/data/sst/manifest.txt) \
            | tee issue-31-full-corpus.log
      - name: Preserve Issue 31 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-31-full-corpus-evidence
          path: |
            issue-31-identity.log
            issue-31-audit.log
            issue-31-full-corpus.log
          if-no-files-found: warn
