name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-independent:
    name: Rust and shared-memory checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dis86
      - name: Test without legacy emulator dependencies
        run: just check
