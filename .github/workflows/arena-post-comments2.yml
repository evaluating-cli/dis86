name: arena-post-comments2

# TEMPORARY: posts the round-2 issue comments (#77/#78 verification + closing
# verification notes for #64-#67 + a #69 status update) using a GITHUB_TOKEN
# with `issues: write`. Idempotent: a per-issue marker guard skips issues that
# already carry a round-2 comment. Delete this workflow and .arena-post2/.
on:
  push:
    paths:
      - '.arena-post2/**'
      - '.github/workflows/arena-post-comments2.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  post:
    name: Post round-2 comments
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Post comments (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for n in 77 78 64 65 66 67 69; do
            body=".arena-post2/issue-$n.md"
            if [ ! -f "$body" ]; then
              echo "issue #$n: no body file, skipping"
              continue
            fi
            count=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments?per_page=100" \
              --jq '[.[] | select(.body | contains("arena-triage-verify-r2"))] | length')
            if [ "$count" != "0" ]; then
              echo "issue #$n: already posted ($count existing), skipping"
              continue
            fi
            gh issue comment "$n" --body-file "$body"
            echo "issue #$n: posted"
          done
      - name: Confirm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for n in 77 78 64 65 66 67 69; do
            gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments?per_page=100" \
              --jq "\"issue #$n round-2 comments: \" + ([.[] | select(.body | contains(\"arena-triage-verify-r2\"))] | length | tostring)"
          done
