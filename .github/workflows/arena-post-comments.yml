name: arena-post-comments

# TEMPORARY: posts the prepared issue-triage comments (issues #64-#69) using a
# GITHUB_TOKEN with `issues: write`. Idempotent: a per-issue marker guard skips
# issues that already carry a comment from this workflow. Delete this workflow
# and .arena-post/ afterwards.
on:
  push:
    paths:
      - '.arena-post/**'
      - '.github/workflows/arena-post-comments.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  post:
    name: Post triage comments
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Post comments (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for n in 64 65 66 67 68 69; do
            body=".arena-post/issue-$n.md"
            if [ ! -f "$body" ]; then
              echo "issue #$n: no body file, skipping"
              continue
            fi
            count=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments?per_page=100" \
              --jq '[.[] | select(.body | contains("arena-triage-verify"))] | length')
            if [ "$count" != "0" ]; then
              echo "issue #$n: already posted ($count existing), skipping"
              continue
            fi
            gh issue comment "$n" --body-file "$body"
            echo "issue #$n: posted"
          done
      - name: Confirm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for n in 64 65 66 67 68 69; do
            gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments?per_page=100" \
              --jq "\"issue #$n comments: \" + ([.[] | select(.body | contains(\"arena-triage-verify\"))] | length | tostring)"
          done
