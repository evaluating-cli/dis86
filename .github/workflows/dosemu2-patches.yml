name: dosemu2 patch series

on:
  push:
    paths:
      - 'patches/dosemu2/**'
      - 'scripts/apply-dosemu2-patches.sh'
      - 'scripts/make-dosemu2-runtime-probe.py'
      - 'scripts/dosemu2-runtime-probe.rs'
      - '.github/workflows/dosemu2-patches.yml'
  pull_request:
    paths:
      - 'patches/dosemu2/**'
      - 'scripts/apply-dosemu2-patches.sh'
      - 'scripts/make-dosemu2-runtime-probe.py'
      - 'scripts/dosemu2-runtime-probe.rs'
      - '.github/workflows/dosemu2-patches.yml'

permissions:
  contents: read

jobs:
  apply-series:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check helper/probe syntax
        run: |
          bash -n scripts/apply-dosemu2-patches.sh
          python3 -m py_compile scripts/make-dosemu2-runtime-probe.py
          rustc --edition=2021 scripts/dosemu2-runtime-probe.rs -o /tmp/dosemu2-runtime-probe

      - name: Fetch pinned dosemu2 source
        env:
          DOSEMU2_BASE: 604ce0cdd1a71f657e2a2df623d216d5ab289313
        run: |
          git init /tmp/dosemu2
          git -C /tmp/dosemu2 remote add origin https://github.com/dosemu2/dosemu2.git
          git -C /tmp/dosemu2 fetch --depth=1 origin "$DOSEMU2_BASE"
          git -C /tmp/dosemu2 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/dosemu2 rev-parse HEAD)" = "$DOSEMU2_BASE"

      - name: Apply patch series with git am
        env:
          DOSEMU2_BASE: 604ce0cdd1a71f657e2a2df623d216d5ab289313
        run: |
          git -C /tmp/dosemu2 config user.name 'dis86 patch CI'
          git -C /tmp/dosemu2 config user.email 'noreply@example.invalid'
          while IFS= read -r patch; do
            [[ -z "$patch" || "$patch" == \#* ]] && continue
            git -C /tmp/dosemu2 am "$GITHUB_WORKSPACE/patches/dosemu2/$patch"
          done < patches/dosemu2/series
          git -C /tmp/dosemu2 diff --check "$DOSEMU2_BASE"..HEAD
          git -C /tmp/dosemu2 log --oneline --decorate "$DOSEMU2_BASE"..HEAD

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool build-essential \
            bison flex gawk pkg-config libbsd-dev libslang2-dev \
            meson ninja-build nasm libelf-dev clang

      - name: Configure minimal interpreter runtime
        working-directory: /tmp/dosemu2
        run: |
          ./autogen.sh
          ./configure \
            --enable-plugins=charsets,msdos,term \
            --disable-fdpp \
            --disable-dj64 \
            --disable-searpc \
            --disable-cpuemu-jit \
            --disable-dlplugins

      - name: Generate library build prerequisites
        working-directory: /tmp/dosemu2
        run: make -C src ../version.hh ../src/plugin/plugin_config.hh

      - name: Compile patched simx86 and mapping libraries
        working-directory: /tmp/dosemu2
        shell: bash
        run: |
          set +e
          {
            make -C src/base/lib/mapping -j2 &&
            make -C src/base/emu-i386/simx86 -j2
          } > /tmp/dosemu2-build.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            echo '--- patched-library build failure (last 160 lines) ---'
            tail -n 160 /tmp/dosemu2-build.log
            exit "$status"
          fi
          echo 'patched mapping and simx86 libraries compiled successfully'

      - name: Link minimal patched dosemu2 runtime
        working-directory: /tmp/dosemu2
        shell: bash
        run: |
          set +e
          make -j2 > /tmp/dosemu2-full-build.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            echo '--- minimal dosemu2 link failure (last 160 lines) ---'
            tail -n 160 /tmp/dosemu2-full-build.log
            exit "$status"
          fi
          test -x bin/dosemu
          test -x 2.0-pre9/bin/dosemu2.bin
          echo 'minimal patched dosemu2 runtime linked successfully'

      - name: Build and install pinned thunk_gen
        env:
          THUNK_GEN_SHA: 4967a317e97167640d524f66860908fcb0d88fa8
        run: |
          git init /tmp/thunk_gen
          git -C /tmp/thunk_gen remote add origin https://github.com/stsp/thunk_gen.git
          git -C /tmp/thunk_gen fetch --depth=1 origin "$THUNK_GEN_SHA"
          git -C /tmp/thunk_gen checkout --detach FETCH_HEAD
          test "$(git -C /tmp/thunk_gen rev-parse HEAD)" = "$THUNK_GEN_SHA"
          cd /tmp/thunk_gen
          ./configure
          meson compile -C build
          sudo meson install -C build
          pkg-config --modversion thunk_gen

      - name: Build and install pinned fdpp
        env:
          FDPP_SHA: f99457bb28b0728afd7699ac2885892205916a92
        run: |
          git init /tmp/fdpp
          git -C /tmp/fdpp remote add origin https://github.com/dosemu2/fdpp.git
          git -C /tmp/fdpp fetch --depth=1 origin "$FDPP_SHA"
          git -C /tmp/fdpp checkout --detach FETCH_HEAD
          test "$(git -C /tmp/fdpp rev-parse HEAD)" = "$FDPP_SHA"
          cd /tmp/fdpp
          ./configure.meson -c -- --prefix=/usr/local
          meson compile -C build
          sudo meson install -C build
          sudo ldconfig
          pkg-config --modversion fdpp

      - name: Relink patched dosemu2 with pinned fdpp
        working-directory: /tmp/dosemu2
        shell: bash
        run: |
          git clean -fdx
          ./autogen.sh
          ./configure \
            --enable-plugins=charsets,msdos,term,fdpp \
            --disable-dj64 \
            --disable-searpc \
            --disable-cpuemu-jit \
            --disable-dlplugins
          make -j2
          test -x bin/dosemu
          test -x 2.0-pre9/bin/dosemu2.bin
          echo 'patched dosemu2 + pinned fdpp runtime stack built successfully'

      - name: Prove lowmem aliasing and end barrier at runtime
        working-directory: /tmp/dosemu2
        shell: bash
        run: |
          set -euo pipefail
          probe_home=/tmp/diis-dosemu2-home
          drive_c="$probe_home/.dosemu/drive_c"
          log=/tmp/diis-dosemu2.log
          probe_log=/tmp/diis-dosemu2-runtime-probe.log
          rm -rf "$probe_home"
          mkdir -p "$drive_c"
          rm -f /dev/shm/hydra_remote /dev/shm/dosemu_mem

          python3 "$GITHUB_WORKSPACE/scripts/make-dosemu2-runtime-probe.py" \
            "$drive_c/TEST.EXE"
          rustc --edition=2021 -O \
            "$GITHUB_WORKSPACE/scripts/dosemu2-runtime-probe.rs" \
            -o /tmp/dosemu2-runtime-probe

          config='$_cpu_vm = "emulated"
          $_cpuemu = (1)
          $_mapping = "mapshm"'

          HOME="$probe_home" \
          DIIS_DOSEMU_VALIDATOR=1 \
          DIIS_DOSEMU_MZ_CS=0 \
          DIIS_DOSEMU_MZ_IP=0 \
          DIIS_DOSEMU_TARGET_DOS_PATH='C:\TEST.EXE' \
            ./bin/dosemu -dumb -q -n \
              -I "$config" \
              -E 'C:\TEST.EXE' >"$log" 2>&1 &
          dosemu_pid=$!

          cleanup() {
            if kill -0 "$dosemu_pid" 2>/dev/null; then
              kill "$dosemu_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          set +e
          timeout 25s /tmp/dosemu2-runtime-probe >"$probe_log" 2>&1
          probe_status=$?
          set -e
          if [[ $probe_status -ne 0 ]]; then
            probe_error="$(tail -n 1 "$probe_log" || true)"
            [[ -n "$probe_error" ]] || probe_error="probe exited with status $probe_status"
            echo "::error title=dosemu2 runtime probe failed::$probe_error"
            echo '--- dosemu2 runtime probe diagnostics ---'
            cat "$probe_log"
            echo '--- dosemu2 runtime log ---'
            cat "$log"
            exit "$probe_status"
          fi

          for _ in $(seq 1 100); do
            if ! kill -0 "$dosemu_pid" 2>/dev/null; then
              break
            fi
            sleep 0.05
          done
          if kill -0 "$dosemu_pid" 2>/dev/null; then
            echo 'dosemu2 did not terminate after END_ACK' >&2
            echo '--- dosemu2 runtime log ---'
            cat "$log"
            exit 1
          fi

          set +e
          wait "$dosemu_pid"
          status=$?
          set -e
          trap - EXIT
          if [[ $status -ne 0 ]]; then
            echo "dosemu2 exited with status $status" >&2
            echo '--- dosemu2 runtime log ---'
            cat "$log"
            exit "$status"
          fi
          echo 'dosemu2 runtime hook proof passed'

      - name: Upload runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dosemu2-runtime-diagnostics
          path: |
            /tmp/diis-dosemu2-runtime-probe.log
            /tmp/diis-dosemu2.log
          if-no-files-found: warn
