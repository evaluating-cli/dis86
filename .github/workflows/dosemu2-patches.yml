name: dosemu2 patch series

on:
  push:
    paths:
      - 'patches/dosemu2/**'
      - 'scripts/apply-dosemu2-patches.sh'
      - '.github/workflows/dosemu2-patches.yml'
  pull_request:
    paths:
      - 'patches/dosemu2/**'
      - 'scripts/apply-dosemu2-patches.sh'
      - '.github/workflows/dosemu2-patches.yml'

permissions:
  contents: read

jobs:
  apply-series:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check helper script syntax
        run: bash -n scripts/apply-dosemu2-patches.sh

      - name: Fetch pinned dosemu2 source
        env:
          DOSEMU2_BASE: 604ce0cdd1a71f657e2a2df623d216d5ab289313
        run: |
          git init /tmp/dosemu2
          git -C /tmp/dosemu2 remote add origin https://github.com/dosemu2/dosemu2.git
          git -C /tmp/dosemu2 fetch --depth=1 origin "$DOSEMU2_BASE"
          git -C /tmp/dosemu2 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/dosemu2 rev-parse HEAD)" = "$DOSEMU2_BASE"

      - name: Apply patch series with git am
        env:
          DOSEMU2_BASE: 604ce0cdd1a71f657e2a2df623d216d5ab289313
        run: |
          git -C /tmp/dosemu2 config user.name 'dis86 patch CI'
          git -C /tmp/dosemu2 config user.email 'noreply@example.invalid'
          while IFS= read -r patch; do
            [[ -z "$patch" || "$patch" == \#* ]] && continue
            git -C /tmp/dosemu2 am "$GITHUB_WORKSPACE/patches/dosemu2/$patch"
          done < patches/dosemu2/series
          git -C /tmp/dosemu2 diff --check "$DOSEMU2_BASE"..HEAD
          git -C /tmp/dosemu2 log --oneline --decorate "$DOSEMU2_BASE"..HEAD

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool build-essential \
            bison flex gawk pkg-config libbsd-dev libslang2-dev \
            meson ninja-build nasm libelf-dev clang

      - name: Configure minimal interpreter runtime
        working-directory: /tmp/dosemu2
        run: |
          ./autogen.sh
          ./configure \
            --enable-plugins=charsets,msdos,term \
            --disable-fdpp \
            --disable-dj64 \
            --disable-searpc \
            --disable-cpuemu-jit \
            --disable-dlplugins

      - name: Generate library build prerequisites
        working-directory: /tmp/dosemu2
        run: make -C src ../version.hh ../src/plugin/plugin_config.hh

      - name: Compile patched simx86 and mapping libraries
        working-directory: /tmp/dosemu2
        shell: bash
        run: |
          set +e
          {
            make -C src/base/lib/mapping -j2 &&
            make -C src/base/emu-i386/simx86 -j2
          } > /tmp/dosemu2-build.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            echo '--- patched-library build failure (last 160 lines) ---'
            tail -n 160 /tmp/dosemu2-build.log
            exit "$status"
          fi
          echo 'patched mapping and simx86 libraries compiled successfully'

      - name: Link minimal patched dosemu2 runtime
        working-directory: /tmp/dosemu2
        shell: bash
        run: |
          set +e
          make -j2 > /tmp/dosemu2-full-build.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            echo '--- minimal dosemu2 link failure (last 160 lines) ---'
            tail -n 160 /tmp/dosemu2-full-build.log
            exit "$status"
          fi
          test -x bin/dosemu
          test -x 2.0-pre9/bin/dosemu2.bin
          echo 'minimal patched dosemu2 runtime linked successfully'

      - name: Build and install pinned thunk_gen
        env:
          THUNK_GEN_SHA: 4967a317e97167640d524f66860908fcb0d88fa8
        run: |
          git init /tmp/thunk_gen
          git -C /tmp/thunk_gen remote add origin https://github.com/stsp/thunk_gen.git
          git -C /tmp/thunk_gen fetch --depth=1 origin "$THUNK_GEN_SHA"
          git -C /tmp/thunk_gen checkout --detach FETCH_HEAD
          test "$(git -C /tmp/thunk_gen rev-parse HEAD)" = "$THUNK_GEN_SHA"
          cd /tmp/thunk_gen
          ./configure
          meson compile -C build
          sudo meson install -C build
          pkg-config --modversion thunk_gen

      - name: Build and install pinned fdpp
        env:
          FDPP_SHA: f99457bb28b0728afd7699ac2885892205916a92
        run: |
          git init /tmp/fdpp
          git -C /tmp/fdpp remote add origin https://github.com/dosemu2/fdpp.git
          git -C /tmp/fdpp fetch --depth=1 origin "$FDPP_SHA"
          git -C /tmp/fdpp checkout --detach FETCH_HEAD
          test "$(git -C /tmp/fdpp rev-parse HEAD)" = "$FDPP_SHA"
          cd /tmp/fdpp
          ./configure.meson -c -- --prefix=/usr/local
          meson compile -C build
          sudo meson install -C build
          sudo ldconfig
          pkg-config --modversion fdpp

      - name: Relink patched dosemu2 with pinned fdpp
        working-directory: /tmp/dosemu2
        shell: bash
        run: |
          git clean -fdx
          ./autogen.sh
          ./configure \
            --enable-plugins=charsets,msdos,term,fdpp \
            --disable-dj64 \
            --disable-searpc \
            --disable-cpuemu-jit \
            --disable-dlplugins
          make -j2
          test -x bin/dosemu
          test -x 2.0-pre9/bin/dosemu2.bin
          echo 'patched dosemu2 + pinned fdpp runtime stack built successfully'
