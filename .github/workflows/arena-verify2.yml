name: arena-verify2

# TEMPORARY verification harness (round 2). Re-runs the closed issues'
# repros (#64-#67) and the two new issues' repros (#77/#78) against the tip of
# `main`, then commits the captured evidence back to this branch.
# Delete .arena-verify2/ and this workflow when done.
on:
  push:
    paths:
      - '.arena-verify2/make_repros.py'
      - '.arena-verify2/run.sh'
      - '.arena-verify2/insert_issue64_test.py'
      - '.github/workflows/arena-verify2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify #64-#67 (closed) and #77/#78 (new) on main
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dis86

      - name: Worktree at the tip of main
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/main origin/main
          echo "main tip: $(git -C /tmp/main rev-parse HEAD)"

      - name: Build dis86 from main
        run: |
          set -euo pipefail
          cd /tmp/main/dis86
          cargo build --locked
          mkdir -p /tmp/main/build/bin
          cp target/debug/dis86 /tmp/main/build/bin/dis86

      - name: Build synthetic inputs
        run: python3 .arena-verify2/make_repros.py

      - name: Insert the #64 IR fixture into main's opt.rs
        run: python3 .arena-verify2/insert_issue64_test.py /tmp/main/dis86/src/decompile/opt.rs

      - name: Run verification matrix
        run: bash .arena-verify2/run.sh /tmp/main/build/bin/dis86 /tmp/main

      - name: Commit evidence back to the branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .arena-verify2/out
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "TEMP evidence: round-2 verification (#64-#67 closed, #77/#78 new) [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
